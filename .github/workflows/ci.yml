name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          for f in src/*.js src/renderer/renderer.js test/*.js; do
            node --check "$f"
          done

      - name: Fault-injection regression suite
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        # CI runners lack the SUID chrome-sandbox helper; the app-level
        # sandbox (webPreferences) is unaffected by this flag.
        run: xvfb-run -a npx electron --no-sandbox test/review-fixes.js

  packaging:
    name: Packaging smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Verify electron-builder config (unpacked linux build)
        run: npx electron-builder --linux --dir --publish never